name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Name the debug APK
        run: |
          target=app/build/outputs/apk/debug/FamilyCloudApp-debug.apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            if [ "$apk" != "$target" ]; then mv "$apk" "$target"; fi
          done

      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not set; building the debug APK only."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "Decoded keystore is empty." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          target=app/build/outputs/apk/release/FamilyCloudApp.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ "$apk" != "$target" ]; then mv "$apk" "$target"; fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          name=$(grep '^versionName=' version.properties | cut -d= -f2-)
          code=$(grep '^versionCode=' version.properties | cut -d= -f2-)
          if ! printf '%s' "$name" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "versionName must be major.minor.patch" >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -Eq '^[1-9][0-9]*$'; then
            echo "versionCode must be a positive integer" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: dist/debug

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: dist/release

      - name: Remove previous APK names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset latest app-release.apk --yes || true
          gh release delete-asset latest app-debug.apk --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: FamilyCloud ${{ steps.version.outputs.name }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            versionName=${{ steps.version.outputs.name }}
            versionCode=${{ steps.version.outputs.code }}
            FamilyCloudApp.apk — подписанный release.
            FamilyCloudApp-debug.apk — debug.
          files: |
            dist/debug/*.apk
            dist/release/*.apk

      - name: Move latest tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push origin refs/tags/latest --force
